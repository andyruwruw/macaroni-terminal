[package]
name = "macaroni"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex.workspace = true
macaroni-core.workspace = true
macaroni-term.workspace = true
macaroni-config.workspace = true
iced.workspace = true
macaroni-browser.workspace = true
macaroni-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
