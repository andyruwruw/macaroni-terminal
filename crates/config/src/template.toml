# Colors, for each interface: "#rrggbb", or "#rrggbbaa" with alpha. Unset ones keep the
# interface's own (the settings dialog's Colors section shows them). The glass interface also
# reads the glass_* and backdrop colors.
#
# Theme colors are shared: accent, success, error, foreground, lines and shade. Colors that
# follow one change with it until they're set themselves. Any color can also be set to a theme
# color's name to follow it, e.g. insertion = "success".
[colors.solid]
# Solid also has its own: border, search, title_bar_border, sidebar_border, workspace, workspace_active, workspace_hover, workspace_border,
#   workspace_border_active, workspace_border_hover, tab_strip, tab, tab_active, tab_hover, tab_border,
#   tab_border_active, tab_border_hover, tab_accent, add_workspace, add_workspace_border, add_tab,
#   add_tab_border (the settings dialog lists them in solid, beside the parts they color).
# accent = "#009ced"
# text = "#ffffff"

[colors.glass]
# Names: background, title_bar, sidebar, close_hover, logo, separator, outline, text, label, muted, faint, attention, working, danger,
#   insertion, surface, item, raised, hover, item_edge, sunken, workspace_icon, shadow, card, card_border, popup, menu_shadow, overlay, knob,
#   glass_light, glass_dark, glass_rim, backdrop_top, backdrop_bottom, glow_1, glow_2, glow_3, glow_4, glow_5.
# attention = "#0aa6ff"

[keybindings]
# Add or override shortcuts as "chord" = "action". Use "none" to remove a default shortcut so
# the key reaches the shell instead.
#
# Modifiers: ctrl, shift, alt (option), cmd (the Windows key on Windows).
# Keys: a-z, 0-9, , . / ; ' [ ] \ - = `, tab, enter, escape, space, backspace, delete, insert,
#       home, end, pageup, pagedown, left, right, up, down, f1-f12.
#
# Actions: new_tab, close_tab, next_tab, previous_tab, split_right, split_down, split_left,
#          split_up, close_pane, focus_left, focus_right, focus_up, focus_down, maximize_pane,
#          equalize_panes, rotate_panes, swap_left, swap_right, swap_up, swap_down, new_workspace,
#          close_workspace, next_workspace, previous_workspace, workspace_1 ... workspace_9,
#          copy, paste, find, zoom_in, zoom_out, reset_zoom, open_settings, open_config,
#          toggle_sidebar, command_palette, show_waiting, next_waiting, new_worktree,
#          previous_prompt, next_prompt, copy_output, agent_dashboard, jump_to_pane,
#          reopen_tab, save_scrollback, search_workspace, search_all, new_window,
#          close_window, move_to_new_window, git_tab, focus_next_region,
#          focus_previous_region, command_history, agent_setup, open_file.
#
# "ctrl+shift+t" = "none"
# "alt+t" = "new_tab"
