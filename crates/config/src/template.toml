# macaroni settings. Changes apply as soon as you save.
# Every setting below shows its default; uncomment a line to change it.

# Color theme: a built-in theme (macaroni-dark, macaroni-light) or the name of a file in the
# "themes" folder next to this file, e.g. themes/mytheme.toml -> theme = "mytheme".
# theme = "macaroni-dark"

# How the app around the terminals looks: "glass" (translucent sheets with lit edges over a
# deep gradient) or "solid" (flat greys).
# ui_theme = "glass"

[font]
# Any installed monospace font. Leave unset to use the bundled JetBrains Mono.
# family = "JetBrains Mono"
# size = 14
# ligatures = false
# A row's height as a multiple of the size, from 1 to 2.5.
# line_height = 1.3

[shell]
# Program for new terminals. Leave unset for the default: your login shell on macOS and Linux;
# on Windows, Git Bash when Git for Windows is installed, else PowerShell 7, else Windows
# PowerShell. Right-click a pane's + button to open a tab with any installed shell.
# program = "powershell.exe"
# args = ["-NoLogo"]

[terminal]
# Lines of history kept per terminal. Applies to terminals opened after the change.
# scrollback = 10000
# The cursor's shape until a program asks for another: "block", "underline" or "beam".
# cursor_style = "block"
# Lines one notch of the mouse wheel scrolls, from 1 to 20.
# scroll_lines = 3
# Copy text to the clipboard as soon as it's selected.
# copy_on_select = false

[notifications]
# Programs can ask for attention (OSC 9, OSC 777, OSC 99): the tab, pane and workspace are
# marked until you type or click in that tab. Show an OS notification too when that tab isn't
# in view or the window isn't focused.
# os = true
# Treat the terminal bell as a request for attention.
# bell = false
# What the bell sounds like: "off", "system" (the system's alert sound), or the path of a sound
# file (.wav on Windows; anything afplay plays on macOS).
# bell_sound = "off"

[session]
# Reopen the last layout (workspaces, splits, tabs and their directories) when macaroni starts.
# restore = true
# In restored tabs that were running Claude Code, resume that session (claude --resume <id>).
# resume_agents = true

[agents]
# Coding agents report what they're doing once their hooks are installed
# (macaroni-cli setup claude, or the settings' Agents section).
# Mark the tab and notify when an agent finishes responding, or when it needs your input.
# notify_finished = true
# notify_input = true
# Show an agent's state and status line (model, context, cost) at the right of its pane's
# tabs. Off by default: the workspace's detail line already shows what the agent is doing.
# tab_status = false
# Give a tab running an agent the sparkles icon.
# tab_icon = true

[browser]
# The page a new browser tab opens.
# home = "https://www.google.com/"
# Where links you Ctrl+click (Cmd+click on macOS) in a terminal open: "panel" for a browser
# split next to the terminal, "system" for your default browser.
# open_links = "panel"

[workspace_items]
# What each workspace's row in the sidebar shows. Text settings are templates: placeholders in
# braces are filled in, anything else shows as written, and a line that comes out empty is
# hidden (so "" hides it). Placeholders:
#   {name}      the workspace's name         {index}     its position, from 1
#   {shortcut}  its 1-9 shortcut number      {title}     the focused tab's title
#   {tabs}      how many tabs it has         {panes}     how many panes
#   {summary}   "2 panes, 5 tabs"            {dir}       the focused tab's folder name
#   {path}      the focused tab's directory  {notice}    the latest notification
#   {agent}     what its coding agent is doing
#   {activity}  the notification, else the agent, else nothing
#   {status}    the notification, else the agent, else the summary
# icon = true
# The tile behind the icon; false shows the icon on its own.
# icon_background = true  (solid: false)
# title = "{name}"
# detail = "{activity}"
# badge = "{shortcut}"
# Show the muted and pinned marks.
# status_icons = true
# close_button = true
# The search bar at the top of the sidebar.
# search = true  (solid: false)

[tab_items]
# What each tab shows, the same way. Pinned tabs always show just their icon. Placeholders:
#   {title}   the tab's name, else the program's or page's title   {name}  the name you gave it
#   {index}   its position in the pane, from 1                       {kind}  Terminal or Browser
#   {dir}     its folder name     {path}  its directory     {url}  a browser tab's address
#   {notice}  its latest notification     {agent}  what its coding agent is doing
# icon = true
# title = "{title}"
# badge = ""
# Show the muted mark.
# status_icons = true
# close_button = true

