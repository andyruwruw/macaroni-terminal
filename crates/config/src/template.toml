# macaroni settings. Changes apply as soon as you save.
# Every setting below shows its default; uncomment a line to change it.

# Color theme: a built-in theme (macaroni-dark, macaroni-light, macaroni-high-contrast) or the
# name of a file in the "themes" folder next to this file, e.g. themes/mytheme.toml ->
# theme = "mytheme".
# theme = "macaroni-dark"

# How the app around the terminals looks: "solid" (flat greys) or "glass" (translucent sheets
# with lit edges over a deep gradient). Some sizes below differ between them; those show
# solid's value with glass's after it.
# ui_theme = "solid"

[font]
# Any installed monospace font. Leave unset to use the bundled JetBrains Mono.
# family = "JetBrains Mono"
# Fonts tried in order for a character the font above lacks, before the bundled symbols font
# and the system's own fallback.
# fallback = ["Cascadia Code", "Noto Sans Mono CJK JP"]
# size = 14
# ligatures = false
# A row's height as a multiple of the size, from 1 to 2.5.
# line_height = 1.3

[shell]
# Program for new terminals. Leave unset for the default: your login shell on macOS and Linux;
# on Windows, Git Bash when Git for Windows is installed, else PowerShell 7, else Windows
# PowerShell. Right-click a pane's + button to open a tab with any installed shell.
# program = "powershell.exe"
# args = ["-NoLogo"]

# SSH profiles: shells on other machines over macaroni's own SSH client, listed in the new-tab
# menu (right-click a pane's + button). Add one per [[ssh]] table. Only host is required; what
# a profile leaves out comes from ~/.ssh/config (HostName, User, Port, IdentityFile, ProxyJump).
# Keys come from the SSH agent, then the identity files; passwords and passphrases are asked
# in the tab. Tabs to the same host share one connection.
# [[ssh]]
# name = "Home server"
# host = "me@192.168.1.20"   # or a Host from ~/.ssh/config
# user = "me"
# port = 22
# identity_file = "~/.ssh/id_ed25519"
# proxy_jump = "me@bastion.example.com"   # hosts to go through, comma-separated
# tmux = "main"              # attach this tmux session in control mode: its windows open as tabs

# Triggers: a regex run over each line a terminal prints (colors taken out), and what a match
# does. Add one per [[trigger]] table; give each at least one of highlight, notify or badge.
# [[trigger]]
# pattern = '(?i)\berror\b'   # Rust regex syntax; single quotes keep the \ as written
# highlight = "red"           # color the match on screen: a workspace color or "#rrggbb"
# notify = true               # mark the tab and notify, with the line as the text
# badge = "error"             # set the tab's badge until you look at it; $1 puts in a group
# name = "Build"              # the notification's title (default: the tab's)

[terminal]
# Lines of history kept per terminal. Applies to terminals opened after the change.
# scrollback = 10000
# The cursor's shape until a program asks for another: "block", "underline" or "beam".
# cursor_style = "block"
# Lines one notch of the mouse wheel scrolls, from 1 to 20.
# scroll_lines = 3
# Copy text to the clipboard as soon as it's selected.
# copy_on_select = false
# Where terminals start in a workspace that has no folder of its own. Blank is your home
# folder; ~ stands for it ("~/code").
# default_dir = ""

[notifications]
# Programs can ask for attention (OSC 9, OSC 777, OSC 99): the tab, pane and workspace are
# marked until you type or click in that tab. Show an OS notification too when that tab isn't
# in view or the window isn't focused.
# os = true
# What a tab asking for attention (an agent finishing or waiting) sounds like when it isn't in
# view: "off", "system" (the notification's own sound), one of macaroni's (Settings >
# Notifications lists them all), such as "chime", "ding", "chord" or "buzzer", or the path of
# a sound file (.wav on Windows; anything afplay plays on macOS).
# sound = "chime"
# Treat the terminal bell as a request for attention.
# bell = false
# What the bell sounds like: "off", "system" (the system's alert sound), one of macaroni's
# sounds (as for sound), or the path of a sound file (.wav on Windows; anything afplay plays on
# macOS).
# bell_sound = "off"
# When a command runs at least this many seconds, its finish asks for attention like a
# notification (0 turns it off). Needs a shell that marks commands (OSC 133): Git Bash does
# here on Windows.
# long_command = 30

[session]
# Reopen the last layout (workspaces, splits, tabs and their directories) when macaroni starts.
# restore = true
# In restored tabs that were running Claude Code or Codex, resume that session
# (claude --resume <id>, codex resume <id>).
# resume_agents = true
# Save each terminal's text when macaroni quits and show it again, dimmed, in its restored tab.
# keep_scrollback = true

[accessibility]
# Scale the whole window, interface and terminal text, on top of the display's own scaling.
# From 0.5 to 3.
# ui_scale = 1
# "system" follows the operating system's setting; "on" or "off" overrides it.
# Turn off fades and other movement.
# reduce_motion = "system"
# Stronger borders and text in the interface, and the high contrast terminal theme.
# high_contrast = "system"
# The least contrast terminal text may have against its background, as a WCAG ratio from 1
# (off) to 21. Text below it is lightened or darkened until it reaches it; 4.5 is WCAG AA.
# minimum_contrast = 1
# How thick the bar and underline cursors are, in pixels, from 1 to 8.
# cursor_thickness = 2
# Have screen readers read out new output in the focused terminal.
# announce_output = true

[agents]
# Coding agents report what they're doing once they're set up: macaroni-cli setup claude, or
# macaroni-cli setup codex (Codex reports when each turn finishes), or the settings' Agents
# section.
# Mark the tab and notify when an agent finishes responding, or when it needs your input.
# notify_finished = true
# notify_input = true
# Give a tab running an agent the sparkles icon.
# tab_icon = true

[plugins]
# Plugins add rows to the top or bottom of the panels they apply to. Each is a folder in the
# plugins folder next to this file, holding a plugin.toml and what it runs; "cache" is built
# in and shows whether an agent's prompt cache is still warm. Turn one on or off for a panel
# from its tab's menu (Plugins). A [plugins.<name>] table changes a plugin everywhere: on,
# agents, kinds, position ("top" or "bottom") and interval (seconds), and any other key is a
# setting passed to the plugin.
#
# [plugins.cache]
# agents = ["codex"]   # only Codex panels
# minutes = 5          # how long the cache lasts; codex_minutes or claude_minutes for one agent

[browser]
# The page a new browser tab opens.
# home = "https://www.google.com/"
# Where links you Ctrl+click (Cmd+click on macOS) in a terminal open: "panel" for a browser
# split next to the terminal, "system" for your default browser.
# open_links = "panel"
# What shows pages: "system" for Edge's WebView2 on Windows or Safari's WebKit on macOS,
# "chromium" for embedded Chromium (Windows only). Applies to pages opened afterwards.
# engine = "system"

[files]
# Where a file you Ctrl+click (Cmd+click on macOS) in a terminal's output opens: "viewer" for a
# file tab next to the terminal, "vscode" for a VS Code tab (Windows, once VS Code for the web
# is downloaded), "app" for the program below. Ctrl+right-click (Cmd+right-click) a file to
# pick where it opens instead.
# open = "viewer"
# The program "app" opens files with: a path, or a command on PATH. Empty means VS Code when its
# code command is installed, else the system's text editor.
# app = ""

[workspace_items]
# What each workspace's row in the sidebar shows. Text settings are templates: placeholders in
# braces are filled in, anything else shows as written, and a line that comes out empty is
# hidden (so "" hides it). Placeholders:
#   {name}      the workspace's name         {index}     its position, from 1
#   {shortcut}  its 1-9 shortcut number      {title}     the focused tab's title
#   {tabs}      how many tabs it has         {panes}     how many panes
#   {summary}   "2 panes, 5 tabs"            {dir}       the focused tab's folder name
#   {path}      the focused tab's directory  {notice}    the latest notification
#   {agent}     what its coding agent is doing
#   {branch}    the git branch of the focused tab's folder (else the workspace folder)
#   {dirty}     "*" when that repository has uncommitted changes
#   {sync}      commits ahead of and behind its upstream: "↑2↓1" (empty when in step)
#   {activity}  the notification, else the agent, else nothing
#   {status}    the notification, else the agent, else the summary
# icon = true
# The tile behind the icon; false shows the icon on its own.
# icon_background = false  (glass: true)
# title = "{name}"
# detail = "{activity}"
# badge = "{shortcut}"
# A large faded label in the top right of each of the workspace's panes, such as "{name}" or
# "{branch}"; empty shows none.
# pane_badge = ""
# Show the muted and pinned marks.
# status_icons = true
# close_button = true
# The search bar at the top of the sidebar.
# search = false  (glass: true)

[tab_items]
# What each tab shows, the same way. Pinned tabs always show just their icon. Placeholders:
#   {title}   the tab's name, else the program's or page's title   {name}  the name you gave it
#   {index}   its position in the pane, from 1                       {kind}  Terminal or Browser
#   {dir}     its folder name     {path}  its directory     {url}  a browser tab's address
#   {notice}  its latest notification     {agent}  what its coding agent is doing
# icon = true
# title = "{title}"
# badge = ""
# Show the muted mark.
# status_icons = true
# close_button = true
# Buttons at the right of each tab strip: a terminal, a browser, and VS Code when it's installed.
# new_buttons = true

