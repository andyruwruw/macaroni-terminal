[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
macaroni-core = { path = "crates/core" }
macaroni-term = { path = "crates/term" }
macaroni-config = { path = "crates/config" }
iced = { version = "0.14", features = ["advanced", "svg", "image", "markdown", "highlighter"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
insta = "1"
criterion = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
notify = "8"
notify-rust = "4"
tauri-winrt-notification = "0.8"
mac-notification-sys = "0.6"
interprocess = "2"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
macaroni-ipc = { path = "crates/ipc" }
macaroni-browser = { path = "crates/browser" }
cef = { version = "=156.1.0", default-features = false }
wry = { version = "0.57", default-features = false, features = ["devtools"] }
webview2-com = "0.39"
cef-dll-sys = { version = "=156.1.0", default-features = false }
windows-sys = "0.61"
rfd = "0.15"
regex = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
accesskit = "0.25"
accesskit_windows = "0.35"
accesskit_macos = "0.27"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["html"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
sha2 = "0.10"
getrandom = "0.3"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSWorkspace"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"

# Full debug info made `target/debug` most of a 150 GB `target` folder. Line tables keep
# backtraces' file and line (the crash log's too); dependencies get none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
