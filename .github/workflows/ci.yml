name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # CEF outside `target/`: rust-cache prunes `target/` when it saves it and would leave a
      # partial CEF distribution (no `archive.json`), which `cef-dll-sys` then fails to read. An
      # env var overrides `.cargo/config.toml`'s `target/cef`. Only Windows builds CEF.
      - run: echo "CEF_PATH=${{ runner.temp }}/cef" >> "$GITHUB_ENV"
        shell: bash
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
